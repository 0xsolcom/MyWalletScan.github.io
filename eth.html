<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ETH永续合约套利监控</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #0f172a;
            color: #e2e8f0;
            line-height: 1.6;
            padding: 20px;
        }
        
        .container {
            max-width: 1200px;
            margin: 0 auto;
        }
        
        header {
            text-align: center;
            margin-bottom: 30px;
            padding: 20px;
            background: linear-gradient(135deg, #1e293b 0%, #0f172a 100%);
            border-radius: 12px;
            border: 1px solid #334155;
        }
        
        h1 {
            font-size: 2.2rem;
            margin-bottom: 10px;
            background: linear-gradient(90deg, #3b82f6, #8b5cf6);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }
        
        .subtitle {
            color: #94a3b8;
            font-size: 1.1rem;
        }
        
        .dashboard {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 20px;
            margin-bottom: 30px;
        }
        
        @media (max-width: 768px) {
            .dashboard {
                grid-template-columns: 1fr;
            }
        }
        
        .exchange-card {
            background: #1e293b;
            border-radius: 12px;
            padding: 20px;
            border: 1px solid #334155;
            transition: transform 0.3s ease, border-color 0.3s ease;
        }
        
        .exchange-card:hover {
            transform: translateY(-2px);
            border-color: #475569;
        }
        
        .exchange-card.variational {
            border-left: 4px solid #3b82f6;
        }
        
        .exchange-card.zklighter {
            border-left: 4px solid #10b981;
        }
        
        .exchange-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 15px;
        }
        
        .exchange-name {
            font-size: 1.3rem;
            font-weight: 600;
        }
        
        .status-indicator {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            padding: 6px 12px;
            border-radius: 20px;
            font-size: 0.9rem;
            font-weight: 500;
        }
        
        .status-connected {
            background-color: rgba(16, 185, 129, 0.2);
            color: #10b981;
        }
        
        .status-disconnected {
            background-color: rgba(239, 68, 68, 0.2);
            color: #ef4444;
        }
        
        .status-dot {
            width: 8px;
            height: 8px;
            border-radius: 50%;
        }
        
        .status-connected .status-dot {
            background-color: #10b981;
            animation: pulse 2s infinite;
        }
        
        .status-disconnected .status-dot {
            background-color: #ef4444;
        }
        
        @keyframes pulse {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.5; }
        }
        
        .price-display {
            font-size: 2.2rem;
            font-weight: 700;
            margin: 15px 0;
            color: #f8fafc;
        }
        
        .update-time {
            color: #94a3b8;
            font-size: 0.9rem;
        }
        
        .comparison-section {
            background: #1e293b;
            border-radius: 12px;
            padding: 25px;
            margin-bottom: 30px;
            border: 1px solid #334155;
        }
        
        .comparison-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
        }
        
        .comparison-title {
            font-size: 1.3rem;
            font-weight: 600;
            color: #e2e8f0;
        }
        
        .price-diff {
            font-size: 2rem;
            font-weight: 700;
            text-align: center;
            margin: 20px 0;
        }
        
        .price-diff.normal {
            color: #10b981;
        }
        
        .price-diff.arbitrage {
            color: #ef4444;
            animation: blink 1s infinite;
        }
        
        @keyframes blink {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.5; }
        }
        
        .threshold-control {
            display: flex;
            align-items: center;
            gap: 10px;
            margin-top: 20px;
        }
        
        .threshold-input {
            background: #0f172a;
            border: 1px solid #475569;
            color: #e2e8f0;
            padding: 8px 12px;
            border-radius: 6px;
            width: 100px;
        }
        
        .threshold-input:focus {
            outline: none;
            border-color: #3b82f6;
        }
        
        .arbitrage-alert {
            background: linear-gradient(135deg, #7f1d1d 0%, #450a0a 100%);
            border: 2px solid #ef4444;
            border-radius: 12px;
            padding: 25px;
            margin-bottom: 30px;
            animation: slideIn 0.5s ease;
        }
        
        @keyframes slideIn {
            from { transform: translateY(-20px); opacity: 0; }
            to { transform: translateY(0); opacity: 1; }
        }
        
        .alert-header {
            display: flex;
            align-items: center;
            gap: 10px;
            margin-bottom: 15px;
            color: #fca5a5;
        }
        
        .alert-title {
            font-size: 1.4rem;
            font-weight: 600;
        }
        
        .alert-content {
            margin: 15px 0;
        }
        
        .alert-strategy {
            display: flex;
            align-items: center;
            gap: 10px;
            margin: 10px 0;
            padding: 10px;
            background: rgba(239, 68, 68, 0.1);
            border-radius: 6px;
        }
        
        .log-section {
            background: #1e293b;
            border-radius: 12px;
            padding: 20px;
            margin-bottom: 30px;
            border: 1px solid #334155;
        }
        
        .log-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 15px;
        }
        
        .log-container {
            height: 200px;
            overflow-y: auto;
            background: #0f172a;
            border-radius: 6px;
            padding: 15px;
            font-family: 'Consolas', 'Monaco', monospace;
            font-size: 0.9rem;
            border: 1px solid #334155;
        }
        
        .log-entry {
            margin-bottom: 8px;
            padding-bottom: 8px;
            border-bottom: 1px solid #334155;
        }
        
        .log-entry:last-child {
            border-bottom: none;
        }
        
        .log-timestamp {
            color: #94a3b8;
            font-size: 0.8rem;
        }
        
        .log-message {
            color: #e2e8f0;
            margin-top: 2px;
        }
        
        .log-message.variational {
            color: #60a5fa;
        }
        
        .log-message.zklighter {
            color: #34d399;
        }
        
        .log-message.arbitrage {
            color: #f87171;
            font-weight: 500;
        }
        
        .controls {
            display: flex;
            gap: 15px;
            margin-top: 20px;
        }
        
        button {
            background: linear-gradient(135deg, #3b82f6 0%, #2563eb 100%);
            color: white;
            border: none;
            padding: 12px 24px;
            border-radius: 8px;
            cursor: pointer;
            font-weight: 600;
            transition: all 0.3s ease;
        }
        
        button:hover {
            transform: translateY(-2px);
            box-shadow: 0 4px 12px rgba(59, 130, 246, 0.3);
        }
        
        button:active {
            transform: translateY(0);
        }
        
        button.stop {
            background: linear-gradient(135deg, #ef4444 0%, #dc2626 100%);
        }
        
        button.clear {
            background: linear-gradient(135deg, #6b7280 0%, #4b5563 100%);
        }
        
        .stats-section {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
            gap: 20px;
            margin-top: 30px;
        }
        
        .stat-card {
            background: #1e293b;
            border-radius: 12px;
            padding: 20px;
            border: 1px solid #334155;
        }
        
        .stat-title {
            color: #94a3b8;
            font-size: 0.9rem;
            margin-bottom: 8px;
        }
        
        .stat-value {
            font-size: 1.8rem;
            font-weight: 700;
            color: #f8fafc;
        }
        
        .footer {
            text-align: center;
            margin-top: 40px;
            color: #64748b;
            font-size: 0.9rem;
            padding-top: 20px;
            border-top: 1px solid #334155;
        }
    </style>
</head>
<body>
    <div class="container">
        <header>
            <h1>ETH永续合约套利监控</h1>
            <p class="subtitle">实时监控Variational与ZKLighter交易所的ETH标记价格</p>
        </header>

        <div class="dashboard">
            <!-- Variational Exchange Card -->
            <div class="exchange-card variational">
                <div class="exchange-header">
                    <div class="exchange-name">🏦 Variational</div>
                    <div class="status-indicator status-disconnected" id="variational-status">
                        <div class="status-dot"></div>
                        <span>未连接</span>
                    </div>
                </div>
                <div class="price-display" id="variational-price">-</div>
                <div class="update-time" id="variational-time">最后更新: -</div>
            </div>

            <!-- ZKLighter Exchange Card -->
            <div class="exchange-card zklighter">
                <div class="exchange-header">
                    <div class="exchange-name">🏦 ZKLighter</div>
                    <div class="status-indicator status-disconnected" id="zklighter-status">
                        <div class="status-dot"></div>
                        <span>未连接</span>
                    </div>
                </div>
                <div class="price-display" id="zklighter-price">-</div>
                <div class="update-time" id="zklighter-time">最后更新: -</div>
            </div>
        </div>

        <!-- Price Comparison Section -->
        <div class="comparison-section">
            <div class="comparison-header">
                <div class="comparison-title">📊 价格对比</div>
                <div class="threshold-control">
                    <span>套利阈值:</span>
                    <input type="number" id="threshold-input" class="threshold-input" value="5" step="0.1" min="0">
                    <span>美元</span>
                </div>
            </div>
            <div class="price-diff normal" id="price-diff">差价: - (0.0000%)</div>
            <div id="arbitrage-status" style="text-align: center; font-size: 1.2rem; font-weight: 500;">
                等待数据...
            </div>
        </div>

        <!-- Arbitrage Alert (hidden by default) -->
        <div class="arbitrage-alert" id="arbitrage-alert" style="display: none;">
            <div class="alert-header">
                <span style="font-size: 1.8rem;">⚠️</span>
                <div class="alert-title">发现套利机会！</div>
            </div>
            <div class="alert-content">
                <div id="alert-details"></div>
                <div class="alert-strategy">
                    <span>💡</span>
                    <span id="arbitrage-strategy"></span>
                </div>
            </div>
            <div id="alert-time" style="color: #fca5a5;"></div>
        </div>

        <!-- Log Section -->
        <div class="log-section">
            <div class="log-header">
                <div class="comparison-title">📝 监控日志</div>
                <div class="controls">
                    <button class="clear" onclick="clearLogs()">清空日志</button>
                </div>
            </div>
            <div class="log-container" id="log-container">
                <div class="log-entry">
                    <div class="log-timestamp">等待连接...</div>
                </div>
            </div>
        </div>

        <!-- Statistics Section -->
        <div class="stats-section">
            <div class="stat-card">
                <div class="stat-title">平均差价</div>
                <div class="stat-value" id="avg-diff">-</div>
            </div>
            <div class="stat-card">
                <div class="stat-title">最大差价</div>
                <div class="stat-value" id="max-diff">-</div>
            </div>
            <div class="stat-card">
                <div class="stat-title">套利机会次数</div>
                <div class="stat-value" id="arbitrage-count">0</div>
            </div>
            <div class="stat-card">
                <div class="stat-title">运行时间</div>
                <div class="stat-value" id="uptime">00:00:00</div>
            </div>
        </div>

        <!-- Controls -->
        <div class="controls">
            <button onclick="startMonitoring()" id="start-btn">开始监控</button>
            <button class="stop" onclick="stopMonitoring()" id="stop-btn" disabled>停止监控</button>
        </div>

        <div class="footer">
            <p>ETH永续合约套利监控系统 | 实时检测Variational与ZKLighter的价格差异</p>
        </div>
    </div>

    <script>
        class ArbitrageMonitor {
            constructor() {
                // 交易所配置
                this.variationalConfig = {
                    action: "subscribe",
                    instruments: [{
                        underlying: "ETH",
                        instrument_type: "perpetual_future",
                        settlement_asset: "USDC",
                        funding_interval_s: 3600
                    }]
                };
                
                this.zklighterConfig = {
                    type: "subscribe",
                    channel: "market_stats/0"
                };
                
                // WebSocket连接
                this.variationalWs = null;
                this.zklighterWs = null;
                
                // 价格数据
                this.variationalPrice = null;
                this.zklighterPrice = null;
                this.variationalUpdateTime = null;
                this.zklighterUpdateTime = null;
                
                // 监控状态
                this.isMonitoring = false;
                this.arbitrageThreshold = 5; // 默认阈值
                this.lastArbitrageAlert = 0;
                this.arbitrageCooldown = 5000; // 5秒冷却时间
                
                // 统计数据
                this.priceHistory = [];
                this.arbitrageCount = 0;
                this.startTime = null;
                this.uptimeInterval = null;
                
                // 日志
                this.logEntries = [];
                this.maxLogEntries = 50;
                
                // 绑定方法
                this.extractVariationalPrice = this.extractVariationalPrice.bind(this);
                this.extractZKLighterPrice = this.extractZKLighterPrice.bind(this);
                this.checkArbitrage = this.checkArbitrage.bind(this);
                this.updateUI = this.updateUI.bind(this);
            }
            
            // 价格提取函数
            extractVariationalPrice(data) {
                if (data.channel && data.channel.startsWith('instrument_price:')) {
                    const pricing = data.pricing;
                    if (pricing) {
                        return parseFloat(pricing.price);
                    }
                }
                return null;
            }
            
            extractZKLighterPrice(data) {
                if (data.channel && data.channel.startsWith('market_stats')) {
                    const stats = data.market_stats;
                    if (stats) {
                        return parseFloat(stats.mark_price);
                    }
                }
                return null;
            }
            
            // 添加日志
            addLog(type, message) {
                const timestamp = new Date().toLocaleTimeString();
                const logEntry = {
                    timestamp,
                    type,
                    message,
                    exchange: type.includes('Variational') ? 'variational' : 
                             type.includes('ZKLighter') ? 'zklighter' : 'system'
                };
                
                this.logEntries.unshift(logEntry);
                if (this.logEntries.length > this.maxLogEntries) {
                    this.logEntries.pop();
                }
                
                this.updateLogUI();
            }
            
            // 更新日志UI
            updateLogUI() {
                const logContainer = document.getElementById('log-container');
                logContainer.innerHTML = '';
                
                this.logEntries.forEach(entry => {
                    const logEntry = document.createElement('div');
                    logEntry.className = 'log-entry';
                    
                    logEntry.innerHTML = `
                        <div class="log-timestamp">[${entry.timestamp}]</div>
                        <div class="log-message ${entry.exchange}">${entry.message}</div>
                    `;
                    
                    logContainer.appendChild(logEntry);
                });
            }
            
            // 清空日志
            clearLogs() {
                this.logEntries = [];
                this.updateLogUI();
            }
            
            // 更新UI
            updateUI() {
                // 更新Variational价格
                if (this.variationalPrice) {
                    document.getElementById('variational-price').textContent = 
                        `$${this.variationalPrice.toFixed(2)}`;
                    document.getElementById('variational-time').textContent = 
                        `最后更新: ${this.formatTime(this.variationalUpdateTime)}`;
                }
                
                // 更新ZKLighter价格
                if (this.zklighterPrice) {
                    document.getElementById('zklighter-price').textContent = 
                        `$${this.zklighterPrice.toFixed(2)}`;
                    document.getElementById('zklighter-time').textContent = 
                        `最后更新: ${this.formatTime(this.zklighterUpdateTime)}`;
                }
                
                // 更新价格对比
                if (this.variationalPrice && this.zklighterPrice) {
                    const priceDiff = Math.abs(this.variationalPrice - this.zklighterPrice);
                    const lowerPrice = Math.min(this.variationalPrice, this.zklighterPrice);
                    const diffPercent = (priceDiff / lowerPrice * 100);
                    
                    const priceDiffElement = document.getElementById('price-diff');
                    priceDiffElement.textContent = `差价: $${priceDiff.toFixed(2)} (${diffPercent.toFixed(4)}%)`;
                    
                    if (priceDiff > this.arbitrageThreshold) {
                        priceDiffElement.className = 'price-diff arbitrage';
                        document.getElementById('arbitrage-status').innerHTML = 
                            '<span style="color: #ef4444;">🚨 发现套利机会！</span>';
                    } else {
                        priceDiffElement.className = 'price-diff normal';
                        document.getElementById('arbitrage-status').innerHTML = 
                            '<span style="color: #10b981;">✅ 价格正常</span>';
                    }
                }
                
                // 更新统计数据
                this.updateStatistics();
            }
            
            // 更新统计数据
            updateStatistics() {
                if (this.priceHistory.length > 0) {
                    const diffs = this.priceHistory.map(item => item.diff);
                    const avgDiff = diffs.reduce((sum, diff) => sum + diff, 0) / diffs.length;
                    const maxDiff = Math.max(...diffs);
                    
                    document.getElementById('avg-diff').textContent = 
                        `$${avgDiff.toFixed(2)}`;
                    document.getElementById('max-diff').textContent = 
                        `$${maxDiff.toFixed(2)}`;
                }
                
                document.getElementById('arbitrage-count').textContent = this.arbitrageCount;
            }
            
            // 检查套利机会
            checkArbitrage() {
                if (!this.variationalPrice || !this.zklighterPrice) {
                    return;
                }
                
                const now = Date.now();
                
                // 检查数据新鲜度
                const maxAge = 10000; // 10秒
                if (now - this.variationalUpdateTime > maxAge || 
                    now - this.zklighterUpdateTime > maxAge) {
                    return;
                }
                
                const priceDiff = Math.abs(this.variationalPrice - this.zklighterPrice);
                const lowerPrice = Math.min(this.variationalPrice, this.zklighterPrice);
                const diffPercent = (priceDiff / lowerPrice * 100);
                
                // 记录价格历史
                this.priceHistory.push({
                    timestamp: now,
                    variational: this.variationalPrice,
                    zklighter: this.zklighterPrice,
                    diff: priceDiff,
                    diffPercent: diffPercent
                });
                
                if (this.priceHistory.length > 100) {
                    this.priceHistory.shift();
                }
                
                // 检查套利机会
                if (priceDiff > this.arbitrageThreshold) {
                    // 冷却时间检查
                    if (now - this.lastArbitrageAlert > this.arbitrageCooldown) {
                        this.lastArbitrageAlert = now;
                        this.arbitrageCount++;
                        
                        // 显示套利警报
                        this.showArbitrageAlert(priceDiff, diffPercent);
                    }
                }
            }
            
            // 显示套利警报
            showArbitrageAlert(priceDiff, diffPercent) {
                const alertDiv = document.getElementById('arbitrage-alert');
                const alertDetails = document.getElementById('alert-details');
                const strategyDiv = document.getElementById('arbitrage-strategy');
                const alertTime = document.getElementById('alert-time');
                
                alertDetails.innerHTML = `
                    <div>💰 价格差异: <strong>$${priceDiff.toFixed(2)} (${diffPercent.toFixed(4)}%)</strong></div>
                    <div>📊 Variational: $${this.variationalPrice.toFixed(2)}</div>
                    <div>📊 ZKLighter: $${this.zklighterPrice.toFixed(2)}</div>
                `;
                
                if (this.variationalPrice > this.zklighterPrice) {
                    strategyDiv.textContent = '在ZKLighter买入，在Variational卖出';
                } else {
                    strategyDiv.textContent = '在Variational买入，在ZKLighter卖出';
                }
                
                alertTime.textContent = `检测时间: ${new Date().toLocaleTimeString()}`;
                
                // 显示警报
                alertDiv.style.display = 'block';
                
                // 添加日志
                this.addLog('arbitrage', 
                    `🚨 发现套利机会！差价: $${priceDiff.toFixed(2)} (${diffPercent.toFixed(4)}%)`);
                
                // 10秒后自动隐藏警报
                setTimeout(() => {
                    alertDiv.style.display = 'none';
                }, 10000);
            }
            
            // 连接Variational
            connectVariational() {
                const wsUrl = 'wss://omni-ws-server.prod.ap-northeast-1.variational.io/prices';
                this.variationalWs = new WebSocket(wsUrl);
                
                this.variationalWs.onopen = () => {
                    this.updateStatus('variational', true);
                    this.variationalWs.send(JSON.stringify(this.variationalConfig));
                    this.addLog('Variational', '✅ WebSocket连接成功');
                };
                
                this.variationalWs.onmessage = (event) => {
                    try {
                        const data = JSON.parse(event.data);
                        const price = this.extractVariationalPrice(data);
                        
                        if (price) {
                            this.variationalPrice = price;
                            this.variationalUpdateTime = Date.now();
                            this.updateUI();
                            this.checkArbitrage();
                        } else if (data.type === 'heartbeat') {
                            this.addLog('Variational', '❤️ 心跳包');
                        }
                    } catch (error) {
                        this.addLog('Variational', `📨 解析失败: ${error.message}`);
                    }
                };
                
                this.variationalWs.onerror = (error) => {
                    this.updateStatus('variational', false);
                    this.addLog('Variational', `❌ WebSocket错误: ${error.message}`);
                };
                
                this.variationalWs.onclose = () => {
                    this.updateStatus('variational', false);
                    this.addLog('Variational', '🔌 连接关闭');
                    
                    // 尝试重新连接
                    if (this.isMonitoring) {
                        setTimeout(() => {
                            this.connectVariational();
                        }, 5000);
                    }
                };
            }
            
            // 连接ZKLighter
            connectZKLighter() {
                const wsUrl = 'wss://mainnet.zklighter.elliot.ai/stream';
                this.zklighterWs = new WebSocket(wsUrl);
                
                this.zklighterWs.onopen = () => {
                    this.updateStatus('zklighter', true);
                    this.zklighterWs.send(JSON.stringify(this.zklighterConfig));
                    this.addLog('ZKLighter', '✅ WebSocket连接成功');
                };
                
                this.zklighterWs.onmessage = (event) => {
                    try {
                        const data = JSON.parse(event.data);
                        
                        // 处理ping消息
                        if (data.type === 'ping') {
                            this.handlePing(data);
                            return;
                        }
                        
                        const price = this.extractZKLighterPrice(data);
                        
                        if (price) {
                            this.zklighterPrice = price;
                            this.zklighterUpdateTime = Date.now();
                            this.updateUI();
                            this.checkArbitrage();
                        } else if (data.type === 'connected') {
                            this.addLog('ZKLighter', `✅ 订阅成功: ${data.channel}`);
                        }
                    } catch (error) {
                        this.addLog('ZKLighter', `📨 解析失败: ${error.message}`);
                    }
                };
                
                this.zklighterWs.onerror = (error) => {
                    this.updateStatus('zklighter', false);
                    this.addLog('ZKLighter', `❌ WebSocket错误: ${error.message}`);
                };
                
                this.zklighterWs.onclose = () => {
                    this.updateStatus('zklighter', false);
                    this.addLog('ZKLighter', '🔌 连接关闭');
                    
                    // 尝试重新连接
                    if (this.isMonitoring) {
                        setTimeout(() => {
                            this.connectZKLighter();
                        }, 5000);
                    }
                };
            }
            
            // 处理ZKLighter的ping消息
            handlePing(pingData) {
                if (pingData.type === 'ping') {
                    const pongResponse = { type: 'pong' };
                    if (this.zklighterWs && this.zklighterWs.readyState === WebSocket.OPEN) {
                        this.zklighterWs.send(JSON.stringify(pongResponse));
                        this.addLog('ZKLighter', '📡 响应ping消息');
                    }
                }
            }
            
            // 更新连接状态
            updateStatus(exchange, isConnected) {
                const statusElement = document.getElementById(`${exchange}-status`);
                if (isConnected) {
                    statusElement.className = 'status-indicator status-connected';
                    statusElement.querySelector('span').textContent = '已连接';
                } else {
                    statusElement.className = 'status-indicator status-disconnected';
                    statusElement.querySelector('span').textContent = '未连接';
                }
            }
            
            // 开始监控
            startMonitoring() {
                if (this.isMonitoring) return;
                
                this.isMonitoring = true;
                this.startTime = Date.now();
                this.arbitrageCount = 0;
                this.priceHistory = [];
                
                // 更新按钮状态
                document.getElementById('start-btn').disabled = true;
                document.getElementById('stop-btn').disabled = false;
                
                // 开始运行时间计时
                this.startUptimeCounter();
                
                // 连接交易所
                this.connectVariational();
                this.connectZKLighter();
                
                this.addLog('system', '🚀 开始监控ETH永续合约价格');
                
                // 设置阈值更新监听
                const thresholdInput = document.getElementById('threshold-input');
                thresholdInput.addEventListener('change', (e) => {
                    this.arbitrageThreshold = parseFloat(e.target.value);
                    this.addLog('system', `套利阈值已设置为: $${this.arbitrageThreshold}`);
                });
            }
            
            // 停止监控
            stopMonitoring() {
                this.isMonitoring = false;
                
                // 关闭WebSocket连接
                if (this.variationalWs) {
                    this.variationalWs.close();
                    this.variationalWs = null;
                }
                
                if (this.zklighterWs) {
                    this.zklighterWs.close();
                    this.zklighterWs = null;
                }
                
                // 更新按钮状态
                document.getElementById('start-btn').disabled = false;
                document.getElementById('stop-btn').disabled = true;
                
                // 停止运行时间计时
                clearInterval(this.uptimeInterval);
                
                this.updateStatus('variational', false);
                this.updateStatus('zklighter', false);
                
                this.addLog('system', '🛑 停止监控');
            }
            
            // 开始运行时间计时
            startUptimeCounter() {
                const uptimeElement = document.getElementById('uptime');
                
                this.uptimeInterval = setInterval(() => {
                    if (this.startTime) {
                        const uptime = Date.now() - this.startTime;
                        uptimeElement.textContent = this.formatUptime(uptime);
                    }
                }, 1000);
            }
            
            // 格式化时间
            formatTime(timestamp) {
                if (!timestamp) return '-';
                return new Date(timestamp).toLocaleTimeString();
            }
            
            // 格式化运行时间
            formatUptime(milliseconds) {
                const seconds = Math.floor(milliseconds / 1000);
                const hours = Math.floor(seconds / 3600);
                const minutes = Math.floor((seconds % 3600) / 60);
                const secs = seconds % 60;
                
                return `${hours.toString().padStart(2, '0')}:${minutes.toString().padStart(2, '0')}:${secs.toString().padStart(2, '0')}`;
            }
        }

        // 创建监控实例
        const monitor = new ArbitrageMonitor();

        // 页面加载完成后初始化
        window.addEventListener('DOMContentLoaded', () => {
            // 设置阈值输入监听
            const thresholdInput = document.getElementById('threshold-input');
            thresholdInput.value = monitor.arbitrageThreshold;
            
            thresholdInput.addEventListener('change', (e) => {
                const value = parseFloat(e.target.value);
                if (!isNaN(value) && value >= 0) {
                    monitor.arbitrageThreshold = value;
                }
            });
        });

        // 全局函数供按钮调用
        function startMonitoring() {
            monitor.startMonitoring();
        }
        
        function stopMonitoring() {
            monitor.stopMonitoring();
        }
        
        function clearLogs() {
            monitor.clearLogs();
        }
    </script>
</body>
</html>
